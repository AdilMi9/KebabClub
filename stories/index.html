<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Log — Kebab Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#171314; --bg-soft:#211C1B;
    --paper:#E9DFC7; --paper-shadow:#D8CDB0;
    --ink:#201A16; --ink-soft:#4A423A;
    --text:#EDE6D6; --muted:#9C9186;
    --accent-red:#B23A2E; --accent-teal:#3E7C74;
    --border:rgba(237,230,214,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, var(--bg-soft), transparent 50%),
      radial-gradient(circle at 90% 15%, rgba(178,58,46,.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px 90px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:26px 0 30px;flex-wrap:wrap;gap:14px;}
  .brand{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.12em;color:var(--muted);text-decoration:none;}
  .brand b{color:var(--accent-teal);}
  .auth-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .auth-box input[type=email], .auth-box input[type=password]{
    background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono', monospace;font-size:12px;padding:8px 10px;width:150px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.03em;
    padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent-teal);}
  .btn.primary{background:var(--accent-teal);border-color:var(--accent-teal);color:#0E1716;font-weight:600;}
  .btn.danger{border-color:var(--accent-red);color:var(--accent-red);}
  .who{font-family:'IBM Plex Mono', monospace;font-size:11.5px;color:var(--muted);}

  h1.title{font-family:'Big Shoulders Display', sans-serif;font-weight:800;font-size:clamp(36px,7vw,58px);text-transform:uppercase;line-height:.92;margin:0 0 8px;}
  .subtitle{color:var(--muted);font-size:14.5px;max-width:56ch;margin-bottom:30px;}
  .back-link{display:inline-block;font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:22px;}
  .back-link:hover{color:var(--accent-teal);}

  .panel{background:var(--paper);color:var(--ink);padding:22px;border:1px solid var(--paper-shadow);}
  .composer{margin-bottom:32px;}
  .composer h2{font-family:'Big Shoulders Display', sans-serif;font-size:24px;text-transform:uppercase;margin:0 0 16px;}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tag-btn{font-family:'IBM Plex Mono', monospace;font-size:12px;padding:7px 12px;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink-soft);cursor:pointer;transition:.15s;}
  .tag-btn:hover{border-color:var(--accent-red);}
  .tag-btn.active{background:var(--accent-red);border-color:var(--accent-red);color:#fff;font-weight:600;}
  textarea{width:100%;min-height:90px;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:11px 13px;resize:vertical;margin-bottom:12px;}
  .attach-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .ghost{font-family:'IBM Plex Mono', monospace;font-size:12px;background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft);padding:8px 13px;cursor:pointer;}
  .ghost:hover{border-color:var(--accent-red);color:var(--accent-red);}
  .ghost.recording{border-color:var(--accent-red);border-style:solid;color:var(--accent-red);}
  #fileInput{display:none;}
  .pending-files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{display:flex;align-items:center;gap:8px;background:#F5EEDD;border:1px solid var(--paper-shadow);padding:6px 10px;font-size:12px;font-family:'IBM Plex Mono', monospace;}
  .chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;}
  .chip button:hover{color:var(--accent-red);}
  .submit-btn{font-family:'Big Shoulders Display', sans-serif;font-weight:800;font-size:15px;background:var(--accent-red);color:#fff;border:none;padding:11px 20px;cursor:pointer;text-transform:uppercase;}
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .form-hint{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent-red);margin-top:10px;min-height:16px;}
  .login-prompt{font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--muted);border:1px dashed var(--border);padding:16px;margin-bottom:32px;}

  .feed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;color:var(--muted);font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .story-card{
    display:flex;gap:14px;background:var(--paper);color:var(--ink);text-decoration:none;
    padding:16px;border:1px solid var(--paper-shadow);margin-bottom:12px;transition:transform .15s ease;
  }
  .story-card:hover{transform:translateX(4px);}
  .story-card .thumb{width:64px;height:64px;flex:none;background:var(--paper-shadow);overflow:hidden;}
  .story-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .story-card .thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .story-card .body{min-width:0;}
  .story-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:'IBM Plex Mono', monospace;font-size:11px;color:#7A6F62;margin-bottom:6px;}
  .log-num{color:var(--accent-red);}
  .pill{padding:2px 9px;border:1px solid var(--paper-shadow);text-transform:uppercase;}
  .story-preview{font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .story-detail{background:var(--paper);color:var(--ink);padding:24px;border:1px solid var(--paper-shadow);margin-bottom:20px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .story-text{font-size:15px;white-space:pre-wrap;margin:14px 0;}
  .attachments{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .attach-item{position:relative;}
  .attach-image img{max-width:100%;max-height:340px;display:block;border:1px solid var(--paper-shadow);}
  .attach-video video{max-width:100%;max-height:340px;display:block;border:1px solid var(--paper-shadow);}
  .attach-audio audio{width:100%;}
  .attach-file{display:flex;align-items:center;gap:10px;background:#F5EEDD;border:1px solid var(--paper-shadow);padding:9px 12px;font-size:13px;}
  .attach-file a{color:var(--accent-teal);text-decoration:none;}
  .attach-file a:hover{text-decoration:underline;}
  .remove-attach{
    font-family:'IBM Plex Mono', monospace;font-size:11px;background:var(--accent-red);color:#fff;
    border:none;padding:4px 9px;cursor:pointer;margin-top:6px;
  }
  .remove-attach:hover{filter:brightness(1.1);}
  .reactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .react-btn{display:flex;align-items:center;gap:6px;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink);font-family:'IBM Plex Mono', monospace;font-size:13px;padding:6px 11px;cursor:pointer;transition:.15s;}
  .react-btn:hover{border-color:var(--accent-red);}
  .react-btn.picked{border-color:var(--accent-red);background:#F0DFC8;}
  .react-btn:disabled{opacity:.5;cursor:not-allowed;}
  .danger-zone{margin-top:18px;padding-top:14px;border-top:1px dashed var(--paper-shadow);}

  .comments-title{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:32px 0 14px;}
  .comment{border:1px solid var(--border);padding:12px 14px;margin-bottom:10px;}
  .comment .meta{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .comment p{margin:0;font-size:14px;}
  .comment-form textarea{
    width:100%;min-height:70px;background:var(--bg-soft);border:1px solid var(--border);
    color:var(--text);font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:10px;margin-bottom:10px;
  }

  .empty, .loading, .error{text-align:center;color:var(--muted);font-family:'IBM Plex Mono', monospace;font-size:13px;padding:50px 20px;border:1px dashed var(--border);}
  .error{color:var(--accent-red);border-color:var(--accent-red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="../index.html"><b>◂</b> VILLAIN HUB / Story Log</a>
    <div class="auth-box" id="authBox"></div>
  </div>
  <div id="app"><div class="loading">loading…</div></div>
</div>

<script>
const SUPABASE_URL = "https://arnpifmnloafkfswfuwr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jYcUVhI1lsj9zxsnRMhdIQ_OEIJB0jO";
const BUCKET = "story-attachments";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  global: { headers: { apikey: SUPABASE_ANON_KEY } }
});

const REACTIONS = [
  {key:'laugh', emoji:'😂'}, {key:'skull', emoji:'💀'},
  {key:'fire', emoji:'🔥'}, {key:'crown', emoji:'👑'}
];
const TAGS = ['LEGEND','FAIL','CRINGE','EPIC'];

let currentUser = null;
let isAdmin = false;
let selectedTag = 'LEGEND';
let pendingFiles = [];

const authBoxEl = document.getElementById('authBox');
const appEl = document.getElementById('app');
const params = new URLSearchParams(location.search);

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function formatSize(b){ if(b<1024) return b+' B'; if(b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }
function kindOf(mime){ if(mime.startsWith('image/')) return 'image'; if(mime.startsWith('video/')) return 'video'; if(mime.startsWith('audio/')) return 'audio'; return 'file'; }

async function refreshAuth(){
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  isAdmin = false;
  if(currentUser){
    const { data } = await sb.from('admins').select('email').eq('email', currentUser.email).maybeSingle();
    isAdmin = !!data;
  }
  renderAuthBox();
}

function renderAuthBox(){
  if(!currentUser){
    authBoxEl.innerHTML = `
      <input type="email" id="loginEmail" placeholder="you@email.com">
      <input type="password" id="loginPassword" placeholder="password">
      <button class="btn" id="loginBtn">Log in</button>
      <button class="btn" id="signupBtn">Sign up</button>
      <span class="who" id="loginHint"></span>
    `;
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const hint = document.getElementById('loginHint');
    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const email = emailEl.value.trim(), password = passEl.value;
      if(!email || !password){ hint.textContent = 'enter email and password'; return; }
      hint.textContent = 'logging in…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ hint.textContent = error.message; return; }
      await refreshAuth(); route();
    });
    document.getElementById('signupBtn').addEventListener('click', async ()=>{
      const email = emailEl.value.trim(), password = passEl.value;
      if(!email || !password){ hint.textContent = 'enter email and password'; return; }
      if(password.length < 6){ hint.textContent = 'password must be at least 6 characters'; return; }
      hint.textContent = 'creating account…';
      const { error } = await sb.auth.signUp({ email, password });
      if(error){ hint.textContent = error.message; return; }
      await refreshAuth(); route();
    });
  } else {
    authBoxEl.innerHTML = `
      <span class="who">${esc(currentUser.email.split('@')[0])}${isAdmin ? ' · ADMIN' : ''}</span>
      <button class="btn danger" id="signOutBtn">Sign out</button>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await sb.auth.signOut(); await refreshAuth(); route();
    });
  }
}

async function fetchStories(){
  const { data, error } = await sb.from('stories').select('*').order('created_at', {ascending:false});
  if(error) throw error;
  return data;
}
async function fetchStory(id){
  const { data, error } = await sb.from('stories').select('*').eq('id', id).single();
  if(error) throw error;
  return data;
}
async function fetchReactions(storyId){
  const { data, error } = await sb.from('story_reactions').select('reaction_key, user_id').eq('story_id', storyId);
  if(error) throw error;
  return data;
}
async function fetchComments(storyId){
  const { data, error } = await sb.from('comments').select('*')
    .eq('target_type','story').eq('target_id', storyId)
    .order('created_at', {ascending:true});
  if(error) throw error;
  return data;
}
async function fetchFeatured(){
  const { data, error } = await sb.from('featured_pages').select('*').order('created_at', {ascending:false});
  if(error) throw error;
  return data;
}
async function uploadFile(file){
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name, mime: file.type || 'application/octet-stream', kind: kindOf(file.type||'') };
}

function attachmentHtml(a, i, canEdit){
  let inner;
  if(a.kind === 'image') inner = `<div class="attach-image"><img src="${a.url}" alt="${esc(a.name)}" loading="lazy"></div>`;
  else if(a.kind === 'video') inner = `<div class="attach-video"><video controls src="${a.url}"></video></div>`;
  else if(a.kind === 'audio') inner = `<div class="attach-audio"><audio controls src="${a.url}"></audio></div>`;
  else inner = `<div class="attach-file">📄 <a href="${a.url}" target="_blank" rel="noopener">${esc(a.name)}</a></div>`;
  return `<div class="attach-item" data-i="${i}">${inner}${canEdit ? `<button class="remove-attach" data-i="${i}">✕ Remove attachment</button>` : ''}</div>`;
}

async function renderList(){
  appEl.innerHTML = `
    <h1 class="title">Story Log</h1>
    <p class="subtitle">Pigeons, kebab, and terrible Heroes of the Storm decisions — all on the record.</p>
    <div id="composerArea"></div>
    <div class="feed-head"><span>Entries</span><span id="countLabel">—</span></div>
    <div id="feed"><div class="loading">loading…</div></div>
  `;
  renderComposer();

  let stories;
  try{ stories = await fetchStories(); }
  catch(e){ document.getElementById('feed').innerHTML = '<div class="error">Could not load stories.</div>'; return; }

  document.getElementById('countLabel').textContent = stories.length + (stories.length===1?' entry':' entries');
  const feedEl = document.getElementById('feed');

  const featured = await fetchFeatured().catch(()=>[]);
  const featuredHtml = featured.map(f => `
    <a class="story-card" href="${f.url}" target="_blank" rel="noopener">
      <div class="thumb">${f.thumbnail_url ? `<img src="${f.thumbnail_url}">` : ''}</div>
      <div class="body">
        <div class="story-meta">
          <span class="pill">${esc(f.tag)}</span>
          <span>${esc(f.author)}</span>
        </div>
        <div class="story-preview">${esc(f.preview)}</div>
      </div>
    </a>
  `).join('');

  if(stories.length === 0 && featured.length === 0){ feedEl.innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
  if(stories.length === 0){ feedEl.innerHTML = featuredHtml; return; }

  const total = stories.length;
  feedEl.innerHTML = featuredHtml + stories.map((s,idx)=>{
    const num = total - idx;
    const thumb = (s.attachments||[]).find(a=>a.kind==='image');
    const videoThumb = !thumb && (s.attachments||[]).find(a=>a.kind==='video');
    const date = new Date(s.created_at);
    const dateStr = date.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'});
    return `
      <a class="story-card" href="index.html?id=${s.id}">
        <div class="thumb">${thumb ? `<img src="${thumb.url}">` : (videoThumb ? `<video src="${videoThumb.url}" muted preload="metadata"></video>` : '')}</div>
        <div class="body">
          <div class="story-meta">
            <span class="log-num">LOG #${String(num).padStart(3,'0')}</span>
            <span class="pill">${esc(s.tag)}</span>
            <span>${esc(s.author)}</span>
            <span>· ${dateStr}</span>
          </div>
          <div class="story-preview">${esc(s.text)}</div>
        </div>
      </a>
    `;
  }).join('');
}

function renderComposer(){
  const el = document.getElementById('composerArea');
  if(!el) return;
  el.innerHTML = '';
}

async function renderDetail(id){
  appEl.innerHTML = '<div class="loading">loading…</div>';
  let s;
  try{ s = await fetchStory(id); }
  catch(e){ appEl.innerHTML = '<div class="error">Story not found.</div>'; return; }

  const canEdit = currentUser && (currentUser.id === s.user_id || isAdmin);
  const reactions = await fetchReactions(id).catch(()=>[]);
  const counts = {}; const mine = new Set();
  reactions.forEach(r=>{
    counts[r.reaction_key] = (counts[r.reaction_key]||0)+1;
    if(currentUser && r.user_id === currentUser.id) mine.add(r.reaction_key);
  });

  const date = new Date(s.created_at);
  const dateStr = date.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'}) + ' ' + date.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const attachments = (s.attachments||[]).map((a,i)=>attachmentHtml(a,i,canEdit)).join('');

  appEl.innerHTML = `
    <a class="back-link" href="index.html">← back to log</a>
    <div class="story-detail">
      <div class="detail-head">
        <div class="story-meta">
          <span class="pill">${esc(s.tag)}</span>
          <span>${esc(s.author)}</span>
          <span>· ${dateStr}</span>
        </div>
      </div>
      <div class="story-text">${esc(s.text)}</div>
      ${attachments ? `<div class="attachments" id="attachmentsBox">${attachments}</div>` : ''}
      <div class="reactions" id="reactionsBox">
        ${REACTIONS.map(r=>{
          const picked = mine.has(r.key) ? 'picked' : '';
          const disabled = currentUser ? '' : 'disabled';
          return `<button class="react-btn ${picked}" ${disabled} data-key="${r.key}"><span>${r.emoji}</span><span>${counts[r.key]||0}</span></button>`;
        }).join('')}
      </div>
      ${!currentUser ? '<div class="who" style="margin-top:8px;">Sign in to react.</div>' : ''}
      ${canEdit ? `<div class="danger-zone"><button class="btn danger" id="deleteStoryBtn">Delete this story</button></div>` : ''}
    </div>

    <div class="comments-title">Comments</div>
    <div id="commentsList"><div class="loading">loading…</div></div>
    <div style="margin-top:14px;">
      ${currentUser
        ? `<div class="comment-form">
             <textarea id="commentText" placeholder="Say something…"></textarea>
             <button class="btn primary" id="postCommentBtn">Post comment</button>
             <div class="form-hint" id="commentHint"></div>
           </div>`
        : `<div class="login-prompt">Sign in (top right) to leave a comment.</div>`}
    </div>
  `;

  try{
    const comments = await fetchComments(id);
    document.getElementById('commentsList').innerHTML = comments.length
      ? comments.map(cm => `
          <div class="comment">
            <div class="meta">${esc(cm.author_name)} · ${new Date(cm.created_at).toLocaleDateString()}</div>
            <p>${esc(cm.text)}</p>
          </div>`).join('')
      : '<div class="empty">No comments yet.</div>';
  }catch(e){
    document.getElementById('commentsList').innerHTML = '<div class="error">Could not load comments.</div>';
  }

  const postBtn = document.getElementById('postCommentBtn');
  if(postBtn){
    postBtn.addEventListener('click', async ()=>{
      const text = document.getElementById('commentText').value.trim();
      const hint = document.getElementById('commentHint');
      if(!text){ hint.textContent = 'write something first'; return; }
      postBtn.disabled = true;
      const { error } = await sb.from('comments').insert({
        user_id: currentUser.id,
        author_name: currentUser.email.split('@')[0],
        target_type: 'story',
        target_id: id,
        text
      });
      postBtn.disabled = false;
      if(error){ hint.textContent = 'could not post — try again'; return; }
      renderDetail(id);
    });
  }

  if(currentUser){
    document.querySelectorAll('.react-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const key = btn.dataset.key;
        const already = mine.has(key);
        btn.disabled = true;
        if(already){
          await sb.from('story_reactions').delete().eq('story_id', id).eq('user_id', currentUser.id).eq('reaction_key', key);
        } else {
          await sb.from('story_reactions').insert({ story_id: id, user_id: currentUser.id, reaction_key: key });
        }
        renderDetail(id);
      });
    });
  }

  if(canEdit){
    document.querySelectorAll('.remove-attach').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('Remove this attachment?')) return;
        const i = Number(btn.dataset.i);
        const newAttachments = (s.attachments||[]).filter((_,idx)=>idx!==i);
        const { error } = await sb.from('stories').update({ attachments: newAttachments }).eq('id', id);
        if(error){ alert('Could not remove attachment.'); return; }
        renderDetail(id);
      });
    });

    document.getElementById('deleteStoryBtn').addEventListener('click', async ()=>{
      if(!confirm('Delete this story permanently? This cannot be undone.')) return;
      const { error } = await sb.from('stories').delete().eq('id', id);
      if(error){ alert('Could not delete story.'); return; }
      location.href = 'index.html';
    });
  }
}

function route(){
  if(params.get('id')) renderDetail(params.get('id'));
  else renderList();
}

(async function init(){
  if(SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    appEl.innerHTML = '<div class="error">Supabase isn\'t configured — set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.</div>';
    renderAuthBox();
    return;
  }
  await refreshAuth();
  sb.auth.onAuthStateChange(async ()=>{ await refreshAuth(); route(); });
  route();
})();
</script>
