<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log a story — Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#171314; --bg-soft:#211C1B;
    --paper:#E9DFC7; --paper-shadow:#D8CDB0;
    --ink:#201A16; --ink-soft:#4A423A;
    --text:#EDE6D6; --muted:#9C9186;
    --accent-red:#B23A2E; --accent-teal:#3E7C74;
    --border:rgba(237,230,214,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, var(--bg-soft), transparent 50%),
      radial-gradient(circle at 90% 15%, rgba(178,58,46,.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 90px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:26px 0 30px;flex-wrap:wrap;gap:14px;}
  .brand{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.12em;color:var(--muted);text-decoration:none;}
  .brand b{color:var(--accent-teal);}
  .auth-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .auth-box input[type=email], .auth-box input[type=password]{
    background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono', monospace;font-size:12px;padding:8px 10px;width:150px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.03em;
    padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent-teal);}
  .btn.primary{background:var(--accent-teal);border-color:var(--accent-teal);color:#0E1716;font-weight:600;}
  .who{font-family:'IBM Plex Mono', monospace;font-size:11.5px;color:var(--muted);}

  h1.title{font-family:'Big Shoulders Display', sans-serif;font-weight:800;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:.95;margin:0 0 8px;}
  .subtitle{color:var(--muted);font-size:14px;max-width:56ch;margin-bottom:26px;}
  .back-link{display:inline-block;font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:22px;}
  .back-link:hover{color:var(--accent-teal);}

  .panel{background:var(--paper);color:var(--ink);padding:22px;border:1px solid var(--paper-shadow);}
  .panel h2{font-family:'Big Shoulders Display', sans-serif;font-size:24px;text-transform:uppercase;margin:0 0 16px;}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tag-btn{font-family:'IBM Plex Mono', monospace;font-size:12px;padding:7px 12px;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink-soft);cursor:pointer;transition:.15s;}
  .tag-btn:hover{border-color:var(--accent-red);}
  .tag-btn.active{background:var(--accent-red);border-color:var(--accent-red);color:#fff;font-weight:600;}
  textarea, input[type=text]{width:100%;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:11px 13px;resize:vertical;margin-bottom:12px;}
  textarea{min-height:110px;}
  .field-label{display:block;font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7A6F62;margin-bottom:6px;}
  .attach-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .ghost{font-family:'IBM Plex Mono', monospace;font-size:12px;background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft);padding:8px 13px;cursor:pointer;}
  .ghost:hover{border-color:var(--accent-red);color:var(--accent-red);}
  .ghost.recording{border-color:var(--accent-red);border-style:solid;color:var(--accent-red);}
  #fileInput{display:none;}
  .pending-files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{display:flex;align-items:center;gap:8px;background:#F5EEDD;border:1px solid var(--paper-shadow);padding:6px 10px;font-size:12px;font-family:'IBM Plex Mono', monospace;}
  .chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;}
  .chip button:hover{color:var(--accent-red);}
  .submit-btn{font-family:'Big Shoulders Display', sans-serif;font-weight:800;font-size:15px;background:var(--accent-red);color:#fff;border:none;padding:11px 20px;cursor:pointer;text-transform:uppercase;}
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .form-hint{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent-red);margin-top:10px;min-height:16px;}
  .success{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent-teal);margin-top:10px;}

  .login-prompt{font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--muted);border:1px dashed var(--border);padding:16px;}
  .error{color:var(--accent-red);font-family:'IBM Plex Mono', monospace;font-size:13px;border:1px dashed var(--accent-red);padding:16px;}
  .featured-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--paper);color:var(--ink);padding:14px 16px;border:1px solid var(--paper-shadow);margin-bottom:8px;}
  .featured-row .meta{font-family:'IBM Plex Mono', monospace;font-size:11px;color:#7A6F62;margin-bottom:4px;}
  .featured-row p{margin:0;font-size:13.5px;}
  .featured-row .del-btn{font-family:'IBM Plex Mono', monospace;font-size:11px;background:var(--accent-red);color:#fff;border:none;padding:5px 10px;cursor:pointer;flex:none;}
  .featured-row .del-btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html"><b>◂</b> Story Log / Admin</a>
    <div class="auth-box" id="authBox"></div>
  </div>
  <div id="app"><div class="who">loading…</div></div>
</div>

<script>
// ============================================================
// CONFIG — same project as index.html
// ============================================================
const SUPABASE_URL = "https://arnpifmnloafkfswfuwr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jYcUVhI1lsj9zxsnRMhdIQ_OEIJB0jO";
const BUCKET = "story-attachments";
// ============================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  global: { headers: { apikey: SUPABASE_ANON_KEY } }
});

const TAGS = ['LEGEND','FAIL','CRINGE','EPIC'];
let currentUser = null;
let isAdmin = false;
let selectedTag = 'LEGEND';
let pendingFiles = [];

const authBoxEl = document.getElementById('authBox');
const appEl = document.getElementById('app');

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function formatSize(b){ if(b<1024) return b+' B'; if(b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }
function kindOf(mime){ if(mime.startsWith('image/')) return 'image'; if(mime.startsWith('video/')) return 'video'; if(mime.startsWith('audio/')) return 'audio'; return 'file'; }

async function refreshAuth(){
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  isAdmin = false;
  if(currentUser){
    const { data } = await sb.from('admins').select('email').eq('email', currentUser.email).maybeSingle();
    isAdmin = !!data;
  }
  renderAuthBox();
  renderApp();
}

function renderAuthBox(){
  if(!currentUser){
    authBoxEl.innerHTML = `
      <input type="email" id="loginEmail" placeholder="you@email.com">
      <input type="password" id="loginPassword" placeholder="password">
      <button class="btn" id="loginBtn">Log in</button>
      <span class="who" id="loginHint"></span>
    `;
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const hint = document.getElementById('loginHint');
    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const email = emailEl.value.trim(), password = passEl.value;
      if(!email || !password){ hint.textContent = 'enter email and password'; return; }
      hint.textContent = 'logging in…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ hint.textContent = error.message; return; }
      await refreshAuth();
    });
  } else {
    authBoxEl.innerHTML = `
      <span class="who">${esc(currentUser.email.split('@')[0])}${isAdmin ? ' · ADMIN' : ''}</span>
      <button class="btn" id="signOutBtn">Sign out</button>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await sb.auth.signOut(); await refreshAuth();
    });
  }
}

async function uploadFile(file){
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name, mime: file.type || 'application/octet-stream', kind: kindOf(file.type||'') };
}

function renderApp(){
  if(!currentUser){
    appEl.innerHTML = `
      <h1 class="title">Log a story</h1>
      <p class="subtitle">Admin only.</p>
      <div class="login-prompt">Sign in (top right) with an admin account.</div>
    `;
    return;
  }
  if(!isAdmin){
    appEl.innerHTML = `
      <h1 class="title">Log a story</h1>
      <div class="error">This account isn't an admin. Signed in as ${esc(currentUser.email)}.</div>
    `;
    return;
  }

  appEl.innerHTML = `
    <h1 class="title">Log a story</h1>
    <p class="subtitle">Posts straight to the Story Log — nobody else can see this page's form.</p>
    <div class="panel">
      <h2>New entry</h2>
      <label class="field-label">Author name (shown on the story)</label>
      <input type="text" id="authorInput" placeholder="e.g. Evran" value="${esc(currentUser.email.split('@')[0])}">
      <label class="field-label">Tag</label>
      <div class="tags" id="tagRow">
        ${TAGS.map(t=>`<button class="tag-btn ${t===selectedTag?'active':''}" data-tag="${t}">${t}</button>`).join('')}
      </div>
      <label class="field-label">Story</label>
      <textarea id="storyText" placeholder="What happened?" maxlength="1200"></textarea>
      <div class="attach-row">
        <button class="ghost" id="attachBtn">📎 Attach photo/video</button>
        <button class="ghost" id="recordBtn">🎙️ Record audio</button>
        <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*">
      </div>
      <div class="pending-files" id="pendingFiles"></div>
      <button class="submit-btn" id="submitBtn">Log this story →</button>
      <div class="form-hint" id="formHint"></div>
    </div>

    <h1 class="title" style="font-size:clamp(24px,5vw,34px);margin-top:44px;">Featured pages</h1>
    <p class="subtitle">Standalone HTML pages (like the Chronicle) that show up as pinned cards in the feed.</p>
    <div class="panel">
      <h2>Add a page</h2>
      <label class="field-label">File name (must match the uploaded .html file exactly)</label>
      <input type="text" id="fUrl" placeholder="e.g. pokemon-championship.html">
      <label class="field-label">Card label / author line</label>
      <input type="text" id="fAuthor" value="Royal Scribe">
      <label class="field-label">Preview text</label>
      <textarea id="fPreview" placeholder="Short description shown on the card…"></textarea>
      <button class="submit-btn" id="addFeaturedBtn">Add page →</button>
      <div class="form-hint" id="featuredHint"></div>
    </div>
    <div id="featuredList" style="margin-top:16px;"></div>
  `;

  document.getElementById('tagRow').querySelectorAll('.tag-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ selectedTag = btn.dataset.tag; renderApp(); });
  });

  const fileInput = document.getElementById('fileInput');
  document.getElementById('attachBtn').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{
    Array.from(fileInput.files).forEach(f=>pendingFiles.push(f));
    fileInput.value = '';
    renderPendingFiles();
  });

  const recordBtn = document.getElementById('recordBtn');
  let recorder=null, chunks=[], stream=null;
  recordBtn.addEventListener('click', async ()=>{
    if(recorder && recorder.state === 'recording'){ recorder.stop(); return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ document.getElementById('formHint').textContent = "Couldn't access microphone."; return; }
    chunks=[];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e=>chunks.push(e.data);
    recorder.onstop = ()=>{
      const blob = new Blob(chunks, {type:'audio/webm'});
      pendingFiles.push(new File([blob], `voice-${Date.now()}.webm`, {type:'audio/webm'}));
      renderPendingFiles();
      stream.getTracks().forEach(t=>t.stop());
      recordBtn.classList.remove('recording'); recordBtn.textContent = '🎙️ Record audio';
    };
    recorder.start();
    recordBtn.classList.add('recording'); recordBtn.textContent = '⏹ Stop';
  });

  renderPendingFiles();
  document.getElementById('submitBtn').addEventListener('click', handleSubmit);

  document.getElementById('addFeaturedBtn').addEventListener('click', handleAddFeatured);
  renderFeaturedList();
}

async function renderFeaturedList(){
  const el = document.getElementById('featuredList');
  if(!el) return;
  el.innerHTML = '<div class="who">loading…</div>';
  try{
    const { data, error } = await sb.from('featured_pages').select('*').order('created_at', {ascending:false});
    if(error) throw error;
    el.innerHTML = data.length ? data.map(f => `
      <div class="featured-row" data-id="${f.id}">
        <div>
          <div class="meta">${esc(f.tag)} · ${esc(f.author)} · ${esc(f.url)}</div>
          <p>${esc(f.preview)}</p>
        </div>
        <button class="del-btn" data-id="${f.id}">✕ Remove</button>
      </div>
    `).join('') : '<div class="who">No featured pages yet.</div>';
    el.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('Remove this featured page from the feed? (the .html file itself stays on the server)')) return;
        await sb.from('featured_pages').delete().eq('id', btn.dataset.id);
        renderFeaturedList();
      });
    });
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="error">Could not load featured pages — make sure the featured_pages table exists.</div>';
  }
}

async function handleAddFeatured(){
  const urlEl = document.getElementById('fUrl');
  const authorEl = document.getElementById('fAuthor');
  const previewEl = document.getElementById('fPreview');
  const btn = document.getElementById('addFeaturedBtn');
  const hint = document.getElementById('featuredHint');
  const url = urlEl.value.trim();
  const author = authorEl.value.trim() || 'Royal Scribe';
  const preview = previewEl.value.trim();
  if(!url){ hint.textContent = 'file name is required'; return; }
  if(!preview){ hint.textContent = 'preview text is required'; return; }
  btn.disabled = true;
  hint.textContent = 'saving…';
  try{
    const { error } = await sb.from('featured_pages').insert({ tag: 'CHRONICLE', author, preview, url });
    if(error) throw error;
    urlEl.value = ''; previewEl.value = ''; hint.textContent = '';
    renderFeaturedList();
  }catch(e){
    console.error(e);
    hint.textContent = "Couldn't save — make sure the featured_pages table exists.";
  }
  btn.disabled = false;
}

function renderPendingFiles(){
  const el = document.getElementById('pendingFiles');
  if(!el) return;
  el.innerHTML = pendingFiles.map((f,i)=>`
    <div class="chip"><span>${esc(f.name)} · ${formatSize(f.size)}</span><button data-i="${i}">✕</button></div>
  `).join('');
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ pendingFiles.splice(Number(btn.dataset.i),1); renderPendingFiles(); });
  });
}

async function handleSubmit(){
  const textEl = document.getElementById('storyText');
  const authorEl = document.getElementById('authorInput');
  const submitBtn = document.getElementById('submitBtn');
  const hint = document.getElementById('formHint');
  const text = textEl.value.trim();
  const author = authorEl.value.trim() || currentUser.email.split('@')[0];
  if(!text){ hint.textContent = 'write something first'; return; }
  submitBtn.disabled = true;
  hint.textContent = pendingFiles.length ? 'uploading…' : 'saving…';
  try{
    const uploaded = [];
    for(const f of pendingFiles) uploaded.push(await uploadFile(f));
    const { data, error } = await sb.from('stories').insert({
      user_id: currentUser.id,
      author,
      tag: selectedTag,
      text,
      attachments: uploaded
    }).select().single();
    if(error) throw error;
    pendingFiles = [];
    hint.textContent = '';
    appEl.insertAdjacentHTML('beforeend', `<div class="success">Posted. <a href="index.html?id=${data.id}">View it →</a></div>`);
    textEl.value = '';
    renderPendingFiles();
    submitBtn.disabled = false;
  }catch(e){
    console.error(e);
    hint.textContent = "Couldn't save — try again.";
    submitBtn.disabled = false;
  }
}

(async function init(){
  if(SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    appEl.innerHTML = '<div class="error">Supabase isn\'t configured.</div>';
    return;
  }
  await refreshAuth();
  sb.auth.onAuthStateChange(async ()=>{ await refreshAuth(); });
})();
</script>
</body>
</html>
