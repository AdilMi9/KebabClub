<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heroes of the Storm: The Gay List</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #ffb347;
    --accent2: #7dd3fc;
    --text: #e8e8e8;
    --muted: #9aa0aa;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1c2029, #0f1115 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 40px 20px 80px;
  }
  header {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 40px;
  }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }
  .search-wrap {
    max-width: 500px;
    margin: 0 auto 40px;
  }
  #search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  #search:focus {
    outline: none;
    border-color: var(--accent2);
  }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .entry:hover {
    transform: translateY(-2px);
    border-color: var(--accent2);
  }
  .hero {
    font-weight: 700;
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
    font-size: 1.05rem;
  }
  .joke {
    color: var(--text);
    line-height: 1.4;
    font-size: 0.95rem;
  }
  .joke .word {
    color: var(--accent2);
    font-weight: 600;
  }
  .count {
    text-align: center;
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .hidden { display: none; }
  footer {
    text-align: center;
    margin-top: 60px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Heroes of the Storm: The Gay List</h1>
  <p>One hero, one crime against good gameplay. Search below to find your particular flavor of gay.</p>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Search a hero or keyword...">
</div>

<div class="count" id="count"></div>

<div class="grid" id="grid"></div>

<footer>Made with love, spite, and 9000 hours in Hero League.</footer>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const count = document.getElementById('count');

function render(filter) {
  grid.innerHTML = '';
  let shown = 0;
  const f = filter.trim().toLowerCase();
  data.forEach(([hero, joke]) => {
    const full = (hero + ' ' + joke).toLowerCase();
    if (f && !full.includes(f)) return;
    shown++;
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<span class="hero">${hero}</span><span class="joke">${joke} <span class="word">${WORD}</span>.</span>`;
    grid.appendChild(div);
  });
  count.textContent = shown + ' of ' + data.length + ' entries';
}

search.addEventListener('input', e => render(e.target.value));
render('');
</script>

</body>
</html>
