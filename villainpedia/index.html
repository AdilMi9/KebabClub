<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villainpedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#171314; --bg-soft:#211C1B;
    --paper:#E9DFC7; --paper-shadow:#D8CDB0;
    --ink:#201A16; --ink-soft:#4A423A;
    --text:#EDE6D6; --muted:#9C9186;
    --accent-red:#B23A2E; --accent-teal:#3E7C74;
    --border:rgba(237,230,214,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, var(--bg-soft), transparent 50%),
      radial-gradient(circle at 90% 15%, rgba(178,58,46,.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:880px;margin:0 auto;padding:0 24px 90px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:26px 0 30px;flex-wrap:wrap;gap:14px;
  }
  .brand{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.12em;color:var(--muted);text-decoration:none;}
  .brand b{color:var(--accent-teal);}
  .auth-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .auth-box input[type=email]{
    background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Mono', monospace;font-size:12px;padding:8px 10px;width:190px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.03em;
    padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);
    cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent-teal);}
  .btn.primary{background:var(--accent-teal);border-color:var(--accent-teal);color:#0E1716;font-weight:600;}
  .btn.danger{border-color:var(--accent-red);color:var(--accent-red);}
  .who{font-family:'IBM Plex Mono', monospace;font-size:11.5px;color:var(--muted);}

  h1.title{
    font-family:'Big Shoulders Display', sans-serif;font-weight:800;
    font-size:clamp(36px,7vw,58px);text-transform:uppercase;line-height:.92;margin:0 0 8px;
  }
  .subtitle{color:var(--muted);font-size:14.5px;max-width:56ch;margin-bottom:30px;}

  .search-row{margin-bottom:26px;}
  .search-row input{
    width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:11px 14px;
  }

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:16px;}
  .card{
    background:var(--paper);color:var(--ink);text-decoration:none;
    padding:14px;border:1px solid var(--paper-shadow);
    box-shadow:0 8px 0 -5px var(--paper-shadow);
    transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-4px);}
  .card .thumb{
    width:100%;aspect-ratio:1/1;background:var(--paper-shadow);
    overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono', monospace;font-size:11px;color:#8A7F6B;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card h3{font-family:'Big Shoulders Display', sans-serif;font-size:19px;text-transform:uppercase;margin:0 0 4px;}
  .card p{font-size:12.5px;color:var(--ink-soft);margin:0;}

  .add-card{
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:2px dashed var(--border);color:var(--muted);
    font-family:'IBM Plex Mono', monospace;font-size:13px;text-decoration:none;
    min-height:150px;transition:.15s;
  }
  .add-card:hover{border-color:var(--accent-teal);color:var(--accent-teal);}

  .empty, .loading, .error{
    text-align:center;color:var(--muted);font-family:'IBM Plex Mono', monospace;
    font-size:13px;padding:50px 20px;border:1px dashed var(--border);
  }
  .error{color:var(--accent-red);border-color:var(--accent-red);}

  /* ---------- detail / dossier ---------- */
  .back-link{
    display:inline-block;font-family:'IBM Plex Mono', monospace;font-size:12px;
    color:var(--muted);text-decoration:none;margin-bottom:22px;
  }
  .back-link:hover{color:var(--accent-teal);}
  .dossier{background:var(--paper);color:var(--ink);padding:28px;border:1px solid var(--paper-shadow);margin-bottom:24px;}
  .dossier-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .dossier h2{font-family:'Big Shoulders Display', sans-serif;font-size:36px;text-transform:uppercase;margin:0;}
  .dossier .aliases{font-family:'IBM Plex Mono', monospace;font-size:12px;color:#7A6F62;margin-top:4px;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0;
    font-family:'IBM Plex Mono', monospace;font-size:12.5px;}
  .field-grid div span.label{display:block;color:#8A7F6B;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;margin-bottom:3px;}
  .bio{font-size:14.5px;line-height:1.6;margin:18px 0;white-space:pre-wrap;}

  .photo-strip{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}
  .photo-strip img{width:130px;height:130px;object-fit:cover;border:1px solid var(--paper-shadow);}

  .quotes{display:flex;flex-direction:column;gap:12px;margin:18px 0;}
  .quote{background:var(--bg-soft);color:var(--text);padding:12px 14px;border-left:3px solid var(--accent-red);}
  .quote p{margin:0 0 8px;font-style:italic;font-size:14px;}
  .quote audio{width:100%;}

  .edit-link{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent-teal);text-decoration:none;}

  /* ---------- comments ---------- */
  .comments-title{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:32px 0 14px;}
  .comment{border:1px solid var(--border);padding:12px 14px;margin-bottom:10px;}
  .comment .meta{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .comment p{margin:0;font-size:14px;}
  .comment-form textarea{
    width:100%;min-height:70px;background:var(--bg-soft);border:1px solid var(--border);
    color:var(--text);font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:10px;margin-bottom:10px;
  }
  .login-prompt{font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--muted);
    border:1px dashed var(--border);padding:14px;}

  /* ---------- form (new / edit) ---------- */
  .form-panel{background:var(--paper);color:var(--ink);padding:26px;border:1px solid var(--paper-shadow);}
  .form-panel h2{font-family:'Big Shoulders Display', sans-serif;font-size:30px;text-transform:uppercase;margin:0 0 20px;}
  .f-row{margin-bottom:16px;}
  .f-row label{display:block;font-family:'IBM Plex Mono', monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;color:#7A6F62;margin-bottom:6px;}
  .f-row input[type=text], .f-row textarea{
    width:100%;background:#F5EEDD;border:1px solid var(--paper-shadow);color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;font-size:14px;padding:10px 12px;
  }
  .f-row textarea{min-height:90px;resize:vertical;}
  .quote-row{border:1px solid var(--paper-shadow);padding:12px;margin-bottom:10px;background:#F5EEDD;}
  .quote-row textarea{min-height:56px;margin-bottom:8px;}
  .quote-row .qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .ghost{font-family:'IBM Plex Mono', monospace;font-size:12px;background:transparent;
    border:1px dashed var(--ink-soft);color:var(--ink-soft);padding:7px 12px;cursor:pointer;}
  .ghost:hover{border-color:var(--accent-red);color:var(--accent-red);}
  .ghost.recording{border-color:var(--accent-red);border-style:solid;color:var(--accent-red);}
  .existing-photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .existing-photos .chip{position:relative;}
  .existing-photos img{width:70px;height:70px;object-fit:cover;border:1px solid var(--paper-shadow);}
  .existing-photos button{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--accent-red);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;
  }
  .form-hint{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--accent-red);margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html"><b>◂</b> VILLAIN HUB / Villainpedia</a>
    <div class="auth-box" id="authBox"></div>
  </div>
  <div id="app"><div class="loading">loading…</div></div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = "https://arnpifmnloafkfswfuwr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jYcUVhI1lsj9zxsnRMhdIQ_OEIJB0jO";
const PHOTO_BUCKET = "character-photos";
const AUDIO_BUCKET = "character-audio";
// ============================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  global: { headers: { apikey: SUPABASE_ANON_KEY } }
});

let currentUser = null;
let isAdmin = false;

const appEl = document.getElementById('app');
const authBoxEl = document.getElementById('authBox');
const params = new URLSearchParams(location.search);

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// ---------- auth ----------
async function refreshAuth(){
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  isAdmin = false;
  if(currentUser){
    const { data } = await sb.from('admins').select('email').eq('email', currentUser.email).maybeSingle();
    isAdmin = !!data;
  }
  renderAuthBox();
}

function renderAuthBox(){
  if(!currentUser){
    authBoxEl.innerHTML = `
      <input type="email" id="loginEmail" placeholder="you@email.com">
      <input type="password" id="loginPassword" placeholder="password">
      <input type="password" id="confirmPassword" placeholder="confirm password" style="display:none;">
      <button class="btn" id="loginBtn">Log in</button>
      <button class="btn" id="signupBtn">Sign up</button>
      <span class="who" id="loginHint"></span>
    `;
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const confirmEl = document.getElementById('confirmPassword');
    const hint = document.getElementById('loginHint');

    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      confirmEl.style.display = 'none';
      const email = emailEl.value.trim();
      const password = passEl.value;
      if(!email || !password){ hint.textContent = 'enter email and password'; return; }
      hint.textContent = 'logging in…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ hint.textContent = error.message; return; }
      await refreshAuth();
      route();
    });

    document.getElementById('signupBtn').addEventListener('click', async ()=>{
      const email = emailEl.value.trim();
      const password = passEl.value;

      // first click: reveal the confirm-password field and stop
      if(confirmEl.style.display === 'none'){
        if(!email || !password){ hint.textContent = 'enter email and password'; return; }
        if(password.length < 6){ hint.textContent = 'password must be at least 6 characters'; return; }
        confirmEl.style.display = 'inline-block';
        hint.textContent = 'confirm your password, then click Sign up again';
        confirmEl.focus();
        return;
      }

      // second click: actually check + submit
      const confirmPassword = confirmEl.value;
      if(password !== confirmPassword){ hint.textContent = "passwords don't match"; return; }

      hint.textContent = 'creating account…';
      const { error } = await sb.auth.signUp({ email, password });
      if(error){ hint.textContent = error.message; return; }
      await refreshAuth();
      route();
    });
  } else {
    authBoxEl.innerHTML = `
      <span class="who">${esc(currentUser.email)}${isAdmin ? ' · ADMIN' : ''}</span>
      ${isAdmin ? '<a class="btn" href="index.html?new=1">+ New character</a>' : ''}
      <button class="btn danger" id="signOutBtn">Sign out</button>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await sb.auth.signOut();
      await refreshAuth();
      route();
    });
  }
}

// ---------- data ----------
async function fetchCharacters(){
  const { data, error } = await sb.from('characters').select('*').order('created_at', {ascending:false});
  if(error) throw error;
  return data;
}
async function fetchCharacter(id){
  const { data, error } = await sb.from('characters').select('*').eq('id', id).single();
  if(error) throw error;
  return data;
}
async function fetchComments(charId){
  const { data, error } = await sb.from('comments').select('*')
    .eq('target_type','character').eq('target_id', charId)
    .order('created_at', {ascending:true});
  if(error) throw error;
  return data;
}

async function uploadToBucket(bucket, file){
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;
  const { error } = await sb.storage.from(bucket).upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

// ---------- views ----------
async function renderList(){
  appEl.innerHTML = `
    <h1 class="title">Villainpedia</h1>
    <p class="subtitle">Every character on record. Click a file to open the dossier.</p>
    <div class="search-row"><input type="text" id="searchBox" placeholder="Search by name or tag…"></div>
    <div class="grid" id="grid"><div class="loading">loading…</div></div>
  `;
  let characters;
  try{
    characters = await fetchCharacters();
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="error">Could not load characters. Check Supabase config.</div>';
    return;
  }

  function draw(list){
    const gridEl = document.getElementById('grid');
    const cards = list.map(c => {
      const photo = (c.photos && c.photos[0]) ? c.photos[0].url : null;
      return `
        <a class="card" href="index.html?id=${c.id}">
          <div class="thumb">${photo ? `<img src="${photo}" alt="">` : 'NO PHOTO'}</div>
          <h3>${esc(c.name)}</h3>
          <p>${esc(c.affiliation || c.status || '')}</p>
        </a>`;
    }).join('');
    gridEl.innerHTML = cards + (isAdmin ? '<a class="card add-card" href="index.html?new=1">+ New file</a>' : '');
    if(list.length === 0 && !isAdmin){
      gridEl.innerHTML = '<div class="empty">No files yet.</div>';
    }
  }
  draw(characters);

  document.getElementById('searchBox').addEventListener('input', (e)=>{
    const q = e.target.value.toLowerCase();
    draw(characters.filter(c =>
      c.name.toLowerCase().includes(q) ||
      (c.tags||[]).some(t=>t.toLowerCase().includes(q))
    ));
  });
}

async function renderDetail(id){
  appEl.innerHTML = '<div class="loading">loading…</div>';
  let c;
  try{ c = await fetchCharacter(id); }
  catch(e){ appEl.innerHTML = '<div class="error">File not found.</div>'; return; }

  const photos = (c.photos||[]).map(p=>`<img src="${p.url}" alt="${esc(p.caption||'')}">`).join('');
  const quotes = (c.quotes||[]).map(q=>`
    <div class="quote">
      <p>"${esc(q.text)}"</p>
      ${q.audio_url ? `<audio controls src="${q.audio_url}"></audio>` : ''}
    </div>`).join('');

  appEl.innerHTML = `
    <a class="back-link" href="index.html">← back to files</a>
    <div class="dossier">
      <div class="dossier-head">
        <div>
          <h2>${esc(c.name)}</h2>
          ${c.aliases && c.aliases.length ? `<div class="aliases">aka ${c.aliases.map(esc).join(', ')}</div>` : ''}
        </div>
        ${isAdmin ? `<a class="edit-link" href="index.html?edit=${c.id}">Edit file →</a>` : ''}
      </div>
      <div class="field-grid">
        ${c.affiliation ? `<div><span class="label">Affiliation</span>${esc(c.affiliation)}</div>` : ''}
        ${c.status ? `<div><span class="label">Status</span>${esc(c.status)}</div>` : ''}
        ${c.abilities && c.abilities.length ? `<div><span class="label">Abilities</span>${c.abilities.map(esc).join(', ')}</div>` : ''}
        ${c.tags && c.tags.length ? `<div><span class="label">Tags</span>${c.tags.map(esc).join(', ')}</div>` : ''}
      </div>
      ${c.summary ? `<div class="bio"><b>${esc(c.summary)}</b></div>` : ''}
      ${c.bio ? `<div class="bio">${esc(c.bio)}</div>` : ''}
      ${photos ? `<div class="photo-strip">${photos}</div>` : ''}
      ${quotes ? `<div class="quotes">${quotes}</div>` : ''}
    </div>

    <div class="comments-title">Field notes</div>
    <div id="commentsList"><div class="loading">loading…</div></div>
    <div style="margin-top:14px;">
      ${currentUser
        ? `<div class="comment-form">
             <textarea id="commentText" placeholder="Add a note…"></textarea>
             <button class="btn primary" id="postCommentBtn">Post note</button>
             <div class="form-hint" id="commentHint"></div>
           </div>`
        : `<div class="login-prompt">Sign in (top right) to leave a note.</div>`}
    </div>
  `;

  try{
    const comments = await fetchComments(id);
    document.getElementById('commentsList').innerHTML = comments.length
      ? comments.map(cm => `
          <div class="comment">
            <div class="meta">${esc(cm.author_name)} · ${new Date(cm.created_at).toLocaleDateString()}</div>
            <p>${esc(cm.text)}</p>
          </div>`).join('')
      : '<div class="empty">No notes yet.</div>';
  }catch(e){
    document.getElementById('commentsList').innerHTML = '<div class="error">Could not load notes.</div>';
  }

  const postBtn = document.getElementById('postCommentBtn');
  if(postBtn){
    postBtn.addEventListener('click', async ()=>{
      const text = document.getElementById('commentText').value.trim();
      const hint = document.getElementById('commentHint');
      if(!text){ hint.textContent = 'write something first'; return; }
      postBtn.disabled = true;
      const { error } = await sb.from('comments').insert({
        user_id: currentUser.id,
        author_name: currentUser.email.split('@')[0],
        target_type: 'character',
        target_id: id,
        text
      });
      postBtn.disabled = false;
      if(error){ hint.textContent = 'could not post — try again'; return; }
      renderDetail(id);
    });
  }
}

// ---------- form (new / edit) ----------
function emptyDraft(){
  return { name:'', aliases:'', summary:'', bio:'', affiliation:'', status:'', abilities:'', tags:'',
    existingPhotos:[], newPhotos:[], quotes:[{text:'', audioFile:null, existingUrl:null}] };
}

async function renderForm(existingId){
  if(!isAdmin){
    appEl.innerHTML = '<div class="error">Admins only. Sign in with an admin account to add or edit files.</div>';
    return;
  }
  appEl.innerHTML = '<div class="loading">loading…</div>';
  let draft = emptyDraft();
  if(existingId){
    const c = await fetchCharacter(existingId);
    draft = {
      name: c.name || '', aliases: (c.aliases||[]).join(', '), summary: c.summary || '', bio: c.bio || '',
      affiliation: c.affiliation || '', status: c.status || '', abilities: (c.abilities||[]).join(', '),
      tags: (c.tags||[]).join(', '),
      existingPhotos: c.photos || [], newPhotos: [],
      quotes: (c.quotes && c.quotes.length) ? c.quotes.map(q=>({text:q.text, audioFile:null, existingUrl:q.audio_url||null})) : [{text:'', audioFile:null, existingUrl:null}]
    };
  }

	function renderQuoteRows(){
	  return draft.quotes.map((q,i)=>`
		<div class="quote-row" data-i="${i}">
		  <textarea placeholder="Quote text…" class="quoteText">${esc(q.text)}</textarea>
		  <div class="qtools">
			<button type="button" class="ghost recordBtn">🎙️ Record audio</button>
			<label class="ghost" style="cursor:pointer;">📎 Upload audio<input type="file" accept="audio/*" class="audioFile" style="display:none;"></label>
			<span class="who audioStatus">${q.audioFile ? q.audioFile.name : (q.existingUrl ? 'has audio' : 'no audio')}</span>
			${(q.audioFile || q.existingUrl) ? '<button type="button" class="ghost removeAudio">Remove audio</button>' : ''}
			${draft.quotes.length > 1 ? '<button type="button" class="ghost removeQuote">Remove</button>' : ''}
		  </div>
		</div>
	  `).join('');
	}

  function renderExistingPhotos(){
    return draft.existingPhotos.map((p,i)=>`
      <div class="chip"><img src="${p.url}"><button type="button" data-i="${i}" class="removePhoto">✕</button></div>
    `).join('');
  }

  appEl.innerHTML = `
    <a class="back-link" href="index.html">← back to files</a>
    <div class="form-panel">
      <h2>${existingId ? 'Edit file' : 'New file'}</h2>
      <div class="f-row"><label>Name</label><input type="text" id="fName" value="${esc(draft.name)}"></div>
      <div class="f-row"><label>Aliases (comma separated)</label><input type="text" id="fAliases" value="${esc(draft.aliases)}"></div>
      <div class="f-row"><label>Summary (short, shown in bold)</label><textarea id="fSummary">${esc(draft.summary)}</textarea></div>
      <div class="f-row"><label>Full bio</label><textarea id="fBio">${esc(draft.bio)}</textarea></div>
      <div class="f-row"><label>Affiliation</label><input type="text" id="fAffiliation" value="${esc(draft.affiliation)}"></div>
      <div class="f-row"><label>Status</label><input type="text" id="fStatus" value="${esc(draft.status)}"></div>
      <div class="f-row"><label>Abilities (comma separated)</label><input type="text" id="fAbilities" value="${esc(draft.abilities)}"></div>
      <div class="f-row"><label>Tags (comma separated)</label><input type="text" id="fTags" value="${esc(draft.tags)}"></div>

      <div class="f-row">
        <label>Photos</label>
        <div class="existing-photos" id="existingPhotos">${renderExistingPhotos()}</div>
        <input type="file" id="fPhotos" accept="image/*" multiple>
      </div>

      <div class="f-row">
        <label>Quotes</label>
        <div id="quoteRows">${renderQuoteRows()}</div>
        <button type="button" class="ghost" id="addQuoteBtn">+ Add quote</button>
      </div>

      <button class="btn primary" id="saveBtn">${existingId ? 'Save changes' : 'Create file'}</button>
		${existingId ? '<button class="btn danger" id="deleteBtn" type="button">Delete file</button>' : ''}
      <div class="form-hint" id="formHint"></div>
    </div>
  `;

  function bindQuoteRowEvents(){
    document.querySelectorAll('.quote-row').forEach(row=>{
      const i = Number(row.dataset.i);
      row.querySelector('.quoteText').addEventListener('input', e=> draft.quotes[i].text = e.target.value);
      row.querySelector('.audioFile').addEventListener('change', e=>{
        if(e.target.files[0]){
          draft.quotes[i].audioFile = e.target.files[0];
          row.querySelector('.audioStatus').textContent = e.target.files[0].name;
        }
      });
      const recBtn = row.querySelector('.recordBtn');
      let recorder=null, chunks=[], stream=null;
      recBtn.addEventListener('click', async ()=>{
        if(recorder && recorder.state === 'recording'){ recorder.stop(); return; }
        try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
        catch(e){ document.getElementById('formHint').textContent = "Couldn't access microphone."; return; }
        chunks=[];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e=>chunks.push(e.data);
        recorder.onstop = ()=>{
          const blob = new Blob(chunks, {type:'audio/webm'});
          const file = new File([blob], `voice-${Date.now()}.webm`, {type:'audio/webm'});
          draft.quotes[i].audioFile = file;
          row.querySelector('.audioStatus').textContent = file.name;
          stream.getTracks().forEach(t=>t.stop());
          recBtn.classList.remove('recording'); recBtn.textContent = '🎙️ Record audio';
        };
        recorder.start();
        recBtn.classList.add('recording'); recBtn.textContent = '⏹ Stop';
      });
      const removeBtn = row.querySelector('.removeQuote');
      if(removeBtn) removeBtn.addEventListener('click', ()=>{
        draft.quotes.splice(i,1);
        document.getElementById('quoteRows').innerHTML = renderQuoteRows();
        bindQuoteRowEvents();
      });
	  const removeAudioBtn = row.querySelector('.removeAudio');
      if(removeAudioBtn){
        removeAudioBtn.addEventListener('click', ()=>{
          draft.quotes[i].audioFile = null;
          draft.quotes[i].existingUrl = null;
          document.getElementById('quoteRows').innerHTML = renderQuoteRows();
          bindQuoteRowEvents();
        });
      }
    });
  }
  bindQuoteRowEvents();

  document.getElementById('addQuoteBtn').addEventListener('click', ()=>{
    draft.quotes.push({text:'', audioFile:null, existingUrl:null});
    document.getElementById('quoteRows').innerHTML = renderQuoteRows();
    bindQuoteRowEvents();
  });

  document.getElementById('fPhotos').addEventListener('change', e=>{
    draft.newPhotos.push(...Array.from(e.target.files));
  });

  function bindExistingPhotoRemovers(){
    document.querySelectorAll('.removePhoto').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        draft.existingPhotos.splice(Number(btn.dataset.i),1);
        document.getElementById('existingPhotos').innerHTML = renderExistingPhotos();
        bindExistingPhotoRemovers();
      });
    });
  }
  bindExistingPhotoRemovers();

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const hint = document.getElementById('formHint');
    const name = document.getElementById('fName').value.trim();
    if(!name){ hint.textContent = 'Name is required.'; return; }

    document.getElementById('saveBtn').disabled = true;
    hint.textContent = 'saving…';

    try{
      const newPhotoUrls = [];
      for(const f of draft.newPhotos){
        newPhotoUrls.push({ url: await uploadToBucket(PHOTO_BUCKET, f), caption:'' });
      }
      const finalPhotos = [...draft.existingPhotos, ...newPhotoUrls];

      const finalQuotes = [];
      for(const q of draft.quotes){
        if(!q.text.trim()) continue;
        let audioUrl = q.existingUrl;
        if(q.audioFile) audioUrl = await uploadToBucket(AUDIO_BUCKET, q.audioFile);
        finalQuotes.push({ text: q.text.trim(), audio_url: audioUrl });
      }

      const payload = {
        name,
        aliases: document.getElementById('fAliases').value.split(',').map(s=>s.trim()).filter(Boolean),
        summary: document.getElementById('fSummary').value.trim(),
        bio: document.getElementById('fBio').value.trim(),
        affiliation: document.getElementById('fAffiliation').value.trim(),
        status: document.getElementById('fStatus').value.trim(),
        abilities: document.getElementById('fAbilities').value.split(',').map(s=>s.trim()).filter(Boolean),
        tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
        photos: finalPhotos,
        quotes: finalQuotes
      };

      let result;
      if(existingId){
        result = await sb.from('characters').update(payload).eq('id', existingId).select().single();
      } else {
        result = await sb.from('characters').insert(payload).select().single();
      }
      if(result.error) throw result.error;

      location.href = `index.html?id=${existingId || result.data.id}`;
    }catch(e){
      console.error(e);
      hint.textContent = "Couldn't save — check console / Supabase config.";
      document.getElementById('saveBtn').disabled = false;
    }
  });
  const deleteBtn = document.getElementById('deleteBtn');
if(deleteBtn){
  deleteBtn.addEventListener('click', async ()=>{
    if(!confirm('Delete this character permanently? This cannot be undone.')) return;
    deleteBtn.disabled = true;
    const { error } = await sb.from('characters').delete().eq('id', existingId);
    if(error){
      document.getElementById('formHint').textContent = 'Could not delete — try again.';
      deleteBtn.disabled = false;
      return;
    }
    location.href = 'index.html';
  });
}
}

// ---------- router ----------
function route(){
  if(params.get('id')) renderDetail(params.get('id'));
  else if(params.get('new')) renderForm(null);
  else if(params.get('edit')) renderForm(params.get('edit'));
  else renderList();
}

(async function init(){
  if(SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    appEl.innerHTML = '<div class="error">Supabase isn\'t configured — set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.</div>';
    renderAuthBox();
    return;
  }
  // clean up magic-link tokens from the URL hash after Supabase reads them
  if(location.hash.includes('access_token')){
    history.replaceState(null, '', location.pathname + location.search);
  }
  await refreshAuth();
  sb.auth.onAuthStateChange(async ()=>{ await refreshAuth(); });
  route();
})();
</script>
