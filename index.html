<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kebab Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171314;
    --bg-soft:#211C1B;
    --paper:#E9DFC7;
    --paper-shadow:#D8CDB0;
    --ink:#201A16;
    --text:#EDE6D6;
    --muted:#9C9186;
    --accent-red:#B23A2E;
    --accent-teal:#3E7C74;
    --border:rgba(237,230,214,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, var(--bg-soft), transparent 50%),
      radial-gradient(circle at 90% 20%, rgba(178,58,46,.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:64px 24px 90px;}

  .stage{margin-bottom:52px;}
  .stamp{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent-teal);
    border:2px solid var(--accent-teal);
    padding:6px 12px;
    transform:rotate(-3deg);
    margin-bottom:22px;
  }
  .stamp .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-teal);}

  @media (prefers-reduced-motion: no-preference){
    .stamp{ animation: stamp-in .45s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes stamp-in{
      0%{ opacity:0; transform:rotate(-16deg) scale(1.6); }
      100%{ opacity:1; transform:rotate(-3deg) scale(1); }
    }
  }

  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:clamp(44px,9vw,84px);
    line-height:.92;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0 0 16px;
  }
  .subtitle{color:var(--muted);font-size:15.5px;max-width:52ch;}

  .files{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:20px;
  }

  .file-card{
    position:relative;
    display:flex;flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    text-decoration:none;
    padding:22px 20px 24px;
    border:1px solid var(--paper-shadow);
    box-shadow:0 10px 0 -6px var(--paper-shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  a.file-card:hover, a.file-card:focus-visible{
    transform:translateY(-5px) rotate(-.4deg);
    box-shadow:0 16px 0 -8px var(--paper-shadow);
  }
  a.file-card:focus-visible{ outline:2px solid var(--accent-teal); outline-offset:3px; }

  .file-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent-red);
    margin-bottom:10px;
  }
  .file-card h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:26px;
    text-transform:uppercase;
    margin:0 0 10px;
  }
  .file-card p{
    font-size:14px;
    color:#4A423A;
    margin:0 0 20px;
    flex-grow:1;
  }
  .open-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;font-weight:600;
    letter-spacing:.04em;
    color:var(--ink);
  }

  /* sealed / coming-soon card */
  .file-card.sealed{ cursor:default; }
  .file-card.sealed p{ color:transparent; }
  .redacted{ display:flex;flex-direction:column;gap:7px;margin-bottom:20px; }
  .redacted span{ height:11px; background:var(--ink); opacity:.85; }
  .redacted span:nth-child(1){width:88%;}
  .redacted span:nth-child(2){width:64%;}
  .redacted span:nth-child(3){width:74%;}

  .seal{
    position:absolute;top:14px;right:14px;
    width:64px;height:64px;border-radius:50%;
    border:2px dashed var(--accent-red);
    color:var(--accent-red);
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    line-height:1.25;
    transform:rotate(-10deg);
  }
  .sealed-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;color:#6B6155;
  }

  .footnote{
    margin-top:56px;
    color:var(--muted);
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">
    <div class="stamp"><span class="dot"></span>Access: open file</div>
    <h1>Kebab Club</h1>
    <p class="subtitle">Every pigeon on record. Pick a file below — nothing here needs clearance to open.</p>
  </div>

  <div class="files" id="files"></div>

  <div class="footnote">New divisions get added here as they're declassified.</div>
</div>

<script>
  // ============================================================
  // CONFIG — one entry per site in the hub. Add a new object here
  // when a new project goes live; nothing else needs to change.
  // ============================================================
  const SITES = [
    {
      num: '01',
      name: 'Villainpedia',
      description: 'Every character on record — bios, powers, photos, and the quotes to prove it.',
      url: 'villainpedia/'
    },
    {
      num: '02',
      name: 'Stories',
      description: 'Totally true stories.',
      url: 'stories/'
    }
  ];
  // ============================================================

  const filesEl = document.getElementById('files');

  filesEl.innerHTML = SITES.map(site => `
    <a class="file-card" href="${site.url}">
      <div class="file-tab">File No.${site.num}</div>
      <h2>${site.name}</h2>
      <p>${site.description}</p>
      <span class="open-link">Open file →</span>
    </a>
  `).join('') + `
    <div class="file-card sealed">
      <div class="file-tab">File No.${String(SITES.length + 1).padStart(2,'0')}</div>
      <div class="seal">File<br>pending</div>
      <h2>Classified</h2>
      <div class="redacted"><span></span><span></span><span></span></div>
      <span class="sealed-note">Being prepared</span>
    </div>
  `;
</script>
</body>
</html>
